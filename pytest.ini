[pytest]
# Several packages have test files with the same basename (test_privacy.py, ...);
# importlib mode lets one pytest run collect them all from packages/.
addopts = --import-mode=importlib
pythonpath =
    packages/python/core/src
    packages/python/openai/src
    packages/python/openai_agents/src
    packages/python/claude_code/src
    packages/python/codex/src
    packages/python/anthropic/src
    packages/python/claude_agents/src
    packages/python/antigravity/src

